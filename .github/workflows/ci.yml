name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build   # type-checks with tsc, then bundles
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t subgroup-audit .
      - name: smoke-test the API inside the image
        run: |
          docker run -d --name api -p 8000:8000 subgroup-audit uvicorn app.api:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q "Clinical Fairness Audit"
          curl -sf -F file=@examples/meps_test_predictions.csv -F label_col=label -F pred_col=risk_score -F metric=fnr -F flag_top_pct=20 \
            -F protected_cols=sex,race,age_band -F use_llm=false localhost:8000/api/audit | python -c "import json,sys; r=json.load(sys.stdin); print(r['worst_intersection'])"
